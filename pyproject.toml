[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "underwrite"
version = "0.0.1"
description = "Local, open-weight document extraction that ships a measured error guarantee."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Krit Jain" }]
keywords = [
  "conformal-prediction",
  "document-extraction",
  "open-weights",
  "selective-prediction",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pillow>=10.3",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
  "scikit-learn>=1.4",
  "scipy>=1.12",
]

[project.optional-dependencies]
ml = [
  "accelerate>=0.31",
  "bitsandbytes>=0.43",
  "torch>=2.4",
  "transformers>=4.53",
]
app = [
  "fastapi>=0.111",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]
data = ["datasets>=3.0"]
synth = ["playwright>=1.45"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/underwrite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
